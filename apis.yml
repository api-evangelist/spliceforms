aid: spliceforms

name: Spliceforms

description: Spliceforms Enterprise Solutions (CIN U72200MH2022PTC395237) is a private limited company incorporated in India on 13 December 2022
  that operates apibanking.com, an API and embedded-banking platform for financial institutions. It provides an API factory, a docs content platform
  and developer portal, and a partner management portal with SDKs, sandboxes and sample apps, to help banks, fintechs and corporates build partner
  integrations. It also publishes a Spectral API style guide on GitHub.

