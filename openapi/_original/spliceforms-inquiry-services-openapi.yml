      - url: http://localhost:3000
      x-stoplight:
        id: z72ur0s87hchj
      tags:
      - data validations
  /v1/customer/accounts/nominees/get:
    post:
      summary: Fetch Account Nominees
      description: Retrieves the list of nominees associated with a customer's accounts.
      operationId: getCustomerAccountNominees
      requestBody:
        description: Shared Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NomineeInquiryRequest'
            examples:
              Example 1:
                value:
                  accountNo: '102001053892'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nominees:
                    type: array
                    description: Specifies the personal information of the nominee designated by the account holder.
                    items:
                      x-stoplight:
                        id: zl8izkvheutvg
                      $ref: '#/components/schemas/Nominee'
              examples:
                Example 1:
                  value:
                    nominees:
                    - name: Virat Kohli
                      gender: male
                      dob: '1990-01-30'
                      address:
                        line1: Near Kailash Complex
                        line2: Opposite Kailash Business Park
                        line3: Near BMC Garden
                        city: Mumbai
                        district: Mumbai
                        state: Maharashtra
                        country: India
                        pin: '410206'
                      mobileNo: '+918082186583'
                      emailId: rahim.sterling@gmail.com
                      guardianDetails:
                        name: Shekhar S Maity
                        dob: '1990-01-30'
                        relationshipWithNominee: Husband
                        address:
                          line1: Near Kailash Complex
                          line2: Opposite Kailash Business Park
                          line3: Near BMC Garden
                          city: Mumbai
                          district: Mumbai
                          state: Maharashtra
                          country: India
                          pin: '410206'
                      relationshipWithApplicant: Father
                      sharePercentage: 50
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
