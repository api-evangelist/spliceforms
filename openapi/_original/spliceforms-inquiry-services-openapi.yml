info:
  version: '1.0'
  title: Inquiry Services
  summary: List of services to inquire customer data
  description: This API provides endpoints to retrive the information about existing customer of the bank. This information could be used by channel application forms to display on the screen or to make
    certain decisions during application form data capture.
  contact:
    name: akhilesh
    url: https://spliceforms.com/
    email: api@apibanking.com
  license:
    url: https://spliceforms.com/
    name: Commercial
servers:
- url: https://api.stitch.spliceforms.com/inquiry
paths:
  /v1/customer/vpa/verification:
    post:
      summary: Verify VPA (UPI Id)
      description: Validates a customer's Virtual Payment Address (VPA) to ensure accuracy and correctness before processing transactions.
      operationId: verifyCustomerVpa
      requestBody:
        description: Shared Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPAOwnershipCheckRequest'
            examples:
              Example 1:
                value:
                  vpa: ranbir.kapoor@paytm
                  customerName: Ali Akbar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPAOwnershipCheckResponse'
              examples:
                Example 1:
                  value:
                    isValid: true
                Example 2:
                  value:
                    isValid: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              examples:
                Example 1:
                  value:
                    type: http://example.com
                    title: string
                    status: 400
                    detail: string
                    instance: http://example.com
                    validationErrors:
                    - message: string
                      properties:
                      - string
                      severity: ERROR
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              examples:
                Example 1:
                  value:
                    type: http://example.com
                    title: string
                    status: 500
                    detail: string
                    instance: http://example.com
      servers:
      - url: http://localhost:3000
      x-stoplight:
        id: 6hs7n9a2ceoze
      tags:
      - data validations
  /v1/customer/bank-account/verification:
    post:
      summary: Verify Bank Account
      description: Validates a customer's bank account details to ensure accuracy before initiating transactions.
      operationId: verifyCustomerBankAccount
      requestBody:
        description: Shared Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountOwnershipCheckRequest'
            examples:
              Example 1:
                value:
                  accountHolderName: Ali Akbar
                  accountNo: '102001053892'
                  accountType: SAVINGS
                  ifsc: HDFC0000001
                  bank: HDFC BANK PVT LTD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountOwnershipCheckResponse'
              examples:
                Example 1:
                  value:
                    isValid: true
                Example 2:
                  value:
                    isValid: false
        '400':
